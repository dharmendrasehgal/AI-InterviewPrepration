name: Build & Test CI

on:
  push:
    branches: [ master, main, develop ]
    paths:
      - 'outputs/implementation/**'
      - '.github/workflows/build-and-test.yml'
  pull_request:
    branches: [ master, main, develop ]
    paths:
      - 'outputs/implementation/**'

env:
  NODE_VERSION: '18'

jobs:
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Backend - Type Check
        working-directory: outputs/implementation/backend
        run: |
          npm ci
          npm run typecheck

      - name: Frontend - Type Check
        working-directory: outputs/implementation/frontend
        run: |
          npm ci
          npm run typecheck

  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_prep
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-
