name: Deploy to Production

on:
  push:
    branches: [ master, main ]
    paths:
      - 'outputs/implementation/**'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  approval:
    name: Deployment Approval
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://interview-prep.example.com
    steps:
      - name: ✅ Deployment Approved
        run: echo "✅ Ready to deploy to production"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: approval
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update ECS service - Backend
        run: |
          aws ecs update-service \
            --cluster interview-prep-cluster \
            --service interview-prep-backend-service \
            --force-new-deployment

      - name: Update ECS service - Frontend
        run: |
          aws ecs update-service \
            --cluster interview-prep-cluster \
            --service interview-prep-frontend-service \
            --force-new-deployment

      - name: Wait for deployment to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster interview-prep-cluster \
            --services interview-prep-backend-service interview-prep-frontend-service

      - name: Run database migrations
        continue-on-error: true
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster interview-prep-cluster --service-name interview-prep-backend-service --query taskArns[0] --output text)
          if [ ! -z "$TASK_ARN" ]; then
            aws ecs execute-command \
              --cluster interview-prep-cluster \
              --task $TASK_ARN \
              --container backend \
              --command "npm run db:migrate" \
              --interactive || true
          fi

      - name: Health check
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.interview-prep.example.com/health || echo "000")
            if [ $STATUS -eq 200 ]; then
              echo "✅ Backend health check passed"
              exit 0
            fi
            echo "⏳ Waiting for backend to be healthy... ($i/30)"
            sleep 10
          done
          echo "❌ Backend health check failed"
          exit 1

      - name: Slack notification - Success
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '✅ Production deployment successful'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author

      - name: Slack notification - Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ Production deployment failed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: outputs/implementation/frontend
        run: npm ci

      - name: Run smoke tests
        working-directory: outputs/implementation/frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.interview-prep.example.com
        run: |
          npm run test:e2e -- --grep @smoke || true
